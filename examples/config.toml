# Run for every command the server sends, as `<script> <command> [args...]`: start, stop, play,
# pause, next, previous. `start` is what switches on gear that does not power up by itself --
# without it the chain deadlocks, because the VAD only streams once there is audio and there is no
# audio until the source is on.
on_command = "/home/rudy/code/scripts/ml-cmd.sh"
