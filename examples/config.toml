# Run when the server reports this input has been selected / deselected. Use these to switch on
# gear that does not power up by itself: without on_start the chain deadlocks, because the VAD only
# streams once there is audio and there is no audio until the source is on.
on_start = "/home/rudy/code/scripts/power_on.sh"
on_stop = "/home/rudy/code/scripts/power_off.sh"
